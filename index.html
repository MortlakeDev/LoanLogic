<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="author" content="Mortlake" />
    <meta name="description" content="__I18N_DESCRIPTION__" />
    <title>__I18N_TITLE__</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161618'/%3E%3Cpath d='M11 8v16h11' fill='none' stroke='%2390c8f8' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Applies the saved theme before first paint so the page never flashes the wrong
      // theme. Keep in sync with src/app/state/theme.ts (a unit test checks it).
      (function () {
        var preference = 'system';
        try {
          var stored = JSON.parse(window.localStorage.getItem('loanlogic:theme:v1'));
          if (stored === 'system' || stored === 'dark' || stored === 'light') {
            preference = stored;
          }
        } catch (error) {
          // Storage unavailable or corrupt: follow the system.
        }
        var theme = preference;
        if (preference === 'system') {
          var light =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: light)').matches;
          theme = light ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript><!--__I18N_NOSCRIPT__--></noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
