<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="author" content="Mortlake" />
    <meta name="description" content="__I18N_DESCRIPTION__" />
    <title>__I18N_TITLE__</title>
    <!-- Favicon: docs/design/favicon.svg inlined (no request). "L" outline from Unbounded
         (wght 600), SIL Open Font License 1.1, Copyright 2022 The Unbounded Project Authors. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1065 1065'%3E%3Crect width='1065' height='1065' rx='234' fill='%230A0A0B'/%3E%3Cpath fill='%23C3F74C' transform='translate(126 908)' d='M261.9 -750V-83.8L177.3 -167.3H739.1V0H73.2V-750Z'/%3E%3C/svg%3E"
    />
    <script>
      // Applies the saved theme before first paint so the page never flashes the wrong
      // theme. Keep in sync with src/app/state/theme.ts (a unit test checks it).
      (function () {
        var preference = 'system';
        try {
          var stored = JSON.parse(window.localStorage.getItem('loanlogic:theme:v1'));
          if (stored === 'system' || stored === 'dark' || stored === 'light') {
            preference = stored;
          }
        } catch (error) {
          // Storage unavailable or corrupt: follow the system.
        }
        var theme = preference;
        if (preference === 'system') {
          var light =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: light)').matches;
          theme = light ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript><!--__I18N_NOSCRIPT__--></noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
